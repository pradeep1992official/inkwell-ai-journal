<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand Gradient matching top nav: from-[#1A73E8] via-[#7B1FA2] to-[#E91E63] -->
    <linearGradient id="inkwellGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="50%" stop-color="#7B1FA2" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7.68" stdDeviation="10.24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect x="0" y="0" width="512" height="512" rx="112.64" fill="url(#inkwellGrad)" />
  
  <!-- Subtle Inner Highlight Rim -->
  <rect x="5.12" y="5.12" width="501.76" height="501.76" rx="107.52" fill="none" stroke="#FFFFFF" stroke-width="10.24" stroke-opacity="0.25" />

  <!-- Feather Quill Brand Mark (Lucide Feather precisely centered & scaled) -->
  <g transform="translate(71.68, 71.68) scale(15.36)" filter="url(#subtleShadow)">
    <path 
      d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z" 
      fill="none" 
      stroke="url(#quillGrad)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <line 
      x1="16" y1="8" x2="2" y2="22" 
      stroke="url(#quillGrad)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <line 
      x1="17.5" y1="15" x2="9" y2="15" 
      stroke="url(#quillGrad)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>